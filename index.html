<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>홀덤 30일</title>
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="홀덤 30일">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<script>try{const t=JSON.parse(localStorage.getItem('holdem30')||'{}').theme;if(t)document.documentElement.dataset.theme=t;}catch(e){}</script>
<style>
/* 기본: 흰 바탕·검은 글씨. 다크: 검은 바탕·흰 글씨. 테이블 펠트만 초록 유지 */
:root{--bg:#ffffff;--panel:#f5f5f5;--panel2:#e9e9e9;--line:#d2d2d2;--text:#111;--muted:#616161;--gold:#8a6a16;--goldbg:#d8ae4f;--green:#2a7f50;--red:#c0392b;--okbg:#dff3e6;--nobg:#f9dcdc;--hintbg:#fbf6e4;--hintline:#e0cf8a;--flashback:#e4eef5;--dangerbg:#f3dede;--felt:#1c5a3b;--felt2:#0f3a26}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#000;--panel:#121212;--panel2:#1d1d1d;--line:#343434;--text:#ececec;--muted:#9c9c9c;--gold:#d8ae4f;--goldbg:#d8ae4f;--green:#2f8f5b;--red:#e05a5a;--okbg:#17301f;--nobg:#3a1b1b;--hintbg:#26231a;--hintline:#5a4a1a;--flashback:#15232c;--dangerbg:#4a2323}}
:root[data-theme=dark]{--bg:#000;--panel:#121212;--panel2:#1d1d1d;--line:#343434;--text:#ececec;--muted:#9c9c9c;--gold:#d8ae4f;--goldbg:#d8ae4f;--green:#2f8f5b;--red:#e05a5a;--okbg:#17301f;--nobg:#3a1b1b;--hintbg:#26231a;--hintline:#5a4a1a;--flashback:#15232c;--dangerbg:#4a2323}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.6 -apple-system,"Segoe UI","Malgun Gothic","Apple SD Gothic Neo",sans-serif;word-break:keep-all;overflow-wrap:anywhere;-webkit-text-size-adjust:100%}
a{color:var(--gold)}
header{position:sticky;top:0;z-index:5;background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;padding:8px 16px;padding-top:calc(8px + env(safe-area-inset-top));flex-wrap:wrap}
header .logo{font-weight:700;color:var(--gold);white-space:nowrap;margin-right:8px}
header a.tab{color:var(--muted);text-decoration:none;padding:6px 10px;border-radius:8px;white-space:nowrap}
header a.tab.on{background:var(--panel2);color:var(--text)}
main{max-width:1000px;margin:0 auto;padding:16px;padding-bottom:calc(24px + env(safe-area-inset-bottom))}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:.6em 0}.tw table{margin:0;min-width:420px}
h1{font-size:1.5em;margin:.2em 0}h2{font-size:1.25em;margin:1.2em 0 .4em;color:var(--gold)}h3{font-size:1.05em;margin:1.2em 0 .3em;color:var(--gold)}
p{margin:.5em 0}ul,ol{padding-left:1.3em}li{margin:.25em 0}
table{border-collapse:collapse;width:100%;margin:.6em 0;font-size:.93em}
th,td{border:1px solid var(--line);padding:5px 8px;text-align:left;vertical-align:top}th{background:var(--panel2)}
pre{background:var(--panel2);padding:10px;border-radius:8px;white-space:pre-wrap;font-size:.9em}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:12px 0}
.muted{color:var(--muted)}.small{font-size:.88em}
button{font:inherit;background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer}
button:hover{border-color:var(--gold)}button.primary{background:var(--green);border-color:var(--green);color:#fff}
button.gold{background:var(--goldbg);border-color:var(--goldbg);color:#1a1a1a;font-weight:600}
button.danger{background:var(--dangerbg);border-color:var(--red)}button:disabled{opacity:.45;cursor:default}
header .theme{margin-left:auto;padding:4px 9px;font-size:.9em}
details.panel summary{cursor:pointer;font-weight:700}details.panel summary::marker{color:var(--gold)}
.status{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin:8px 0;font-size:.95em}
.status b{color:var(--gold)}
.terms td:first-child{white-space:nowrap;font-weight:600}
/* 강의 본문 가독성 */
.body{font-size:1.04em;line-height:1.85}
.body p{margin:.75em 0}.body li{margin:.4em 0}
.body h3{margin-top:2em;padding-top:.7em;border-top:1px solid var(--line);font-size:1.12em}
.body h3:first-of-type{border-top:0;margin-top:.4em}
.body .panel{border-left:4px solid var(--gold);background:var(--panel2)}
.body b{background:linear-gradient(transparent 62%,var(--hintbg) 62%)}
.body tr:nth-child(even) td{background:rgba(128,128,128,.07)}.body td,.body th{padding:7px 9px}
.toc ol{margin:.3em 0;columns:2;column-gap:24px}.toc li{margin:.15em 0}
.lnk{color:var(--gold);cursor:pointer;text-decoration:underline}
/* 본문 위젯 */
.wg{background:var(--panel2);border:1px dashed var(--gold);border-radius:12px;padding:12px 14px;margin:14px 0}
.wg::before{content:"직접 만져 보기";display:block;font-size:.8em;color:var(--gold);font-weight:700;margin-bottom:6px}
.wg h4{margin:.4em 0}.wg table{width:auto}.wg .card{margin-bottom:3px}
.table.mini{max-height:300px;margin:6px 0}
.cardbtn{cursor:pointer;display:inline-block}.card.sel{outline:3px solid var(--goldbg);transform:translateY(-5px)}
.bar2{display:flex;height:24px;border-radius:6px;overflow:hidden;font-size:.75em;color:#fff;text-align:center;line-height:24px;white-space:nowrap}
.eqbar{height:24px;background:var(--red);border-radius:6px;overflow:hidden}.eqbar i{display:block;height:100%;background:var(--green)}
.wg input[type=range]{width:220px;max-width:60%}
input[type=number],input[type=text],select{font:inherit;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:6px 8px;width:110px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.cd{font-weight:700;white-space:nowrap}.cd.s1,.cd.s2{color:var(--red)}.cd.s0,.cd.s3{color:var(--text)}
.bar{height:10px;background:var(--panel2);border-radius:5px;overflow:hidden}.bar i{display:block;height:100%;background:var(--gold)}
/* 커리큘럼 */
.days{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.daychip{display:block;text-decoration:none;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:.9em;line-height:1.3}
.daychip b{display:block;color:var(--gold)}.daychip.done{border-color:var(--green)}.daychip.done b::after{content:" ✓";color:var(--green)}
.quiz .q{margin:12px 0;padding:10px 12px;background:var(--panel2);border-radius:10px}
.quiz .opt{display:block;width:100%;text-align:left;margin:4px 0;background:var(--bg)}
.quiz .opt.ok{border-color:var(--green);background:var(--okbg)}.quiz .opt.no{border-color:var(--red);background:var(--nobg)}
.quiz .why{margin-top:6px;padding:8px;border-left:3px solid var(--gold);background:var(--panel);font-size:.92em}
/* 게임 */
.table{position:relative;width:100%;aspect-ratio:16/9;max-height:520px;background:radial-gradient(ellipse at center,var(--felt),var(--felt2) 75%);border:10px solid #3b2a1a;border-radius:50%/50%;box-shadow:inset 0 0 40px #0007;margin:8px 0}
.seat{position:absolute;width:140px;transform:translate(-50%,-50%);text-align:center;font-size:.85em}
.seat .nm{background:#0009;border-radius:8px;padding:3px 6px;display:inline-block;line-height:1.3}
.seat.act .nm{outline:2px solid var(--gold)}.seat.fold{opacity:.4}
.seat .cards{height:48px;margin:3px 0}.seat .bet{color:var(--gold);font-weight:600;min-height:1.4em}
.card{display:inline-block;width:32px;height:44px;background:#f7f4ea;color:#111;border-radius:5px;margin:0 2px;font-weight:700;font-size:15px;line-height:1.1;padding-top:3px;vertical-align:top;box-shadow:0 1px 3px #0008}
.card.r{color:#c0392b}.card.back{background:repeating-linear-gradient(45deg,#7a1f1f,#7a1f1f 4px,#5a1515 4px,#5a1515 8px)}
.card.big{width:44px;height:60px;font-size:20px;padding-top:6px}
.center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center}
.pot{color:var(--gold);font-weight:700;margin-bottom:6px}
.dbtn{display:inline-block;background:#fff;color:#000;border-radius:50%;width:20px;height:20px;line-height:20px;font-size:12px;font-weight:700;margin-left:4px}
.log{height:170px;overflow:auto;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px;font-size:.85em;white-space:pre-wrap}
.hint{background:var(--hintbg);border:1px solid var(--hintline);border-radius:10px;padding:10px 12px;font-size:.92em}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0}
/* 암기카드 */
.flash{min-height:200px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:1.15em;padding:20px;background:var(--panel2);border:1px solid var(--line);border-radius:14px;cursor:pointer}
.flash.back{background:var(--flashback)}
.tags button.on{border-color:var(--gold);color:var(--gold)}
/* 레인지 그리드 */
.grid{display:grid;grid-template-columns:repeat(13,1fr);gap:2px;max-width:520px;font-size:11px;user-select:none}
.grid span{aspect-ratio:1;display:flex;align-items:center;justify-content:center;background:var(--panel2);border-radius:3px;color:var(--muted)}
.grid span.in{background:var(--green);color:#fff;font-weight:600}.grid span.pair{outline:1px solid var(--muted)}
/* 모바일 (아이폰 16e 가로 390pt 기준). 폭으로 자동 전환, 별도 스위치 없음 */
@media (max-width:640px){
html,body{font-size:15.5px}
header{padding:6px 10px;padding-top:calc(6px + env(safe-area-inset-top));gap:4px}header .logo{font-size:.95em;margin-right:2px}header a.tab{padding:5px 8px;font-size:.9em}
main{padding:12px}h1{font-size:1.3em}
.panel{padding:12px;margin:10px 0;border-radius:10px}
button{min-height:40px;padding:8px 12px}.quiz .opt{min-height:44px}
input[type=number],input[type=text],select{min-height:40px}
.terms td:first-child{white-space:normal;min-width:7em}
.grid{font-size:9px;gap:1px}
.days{grid-template-columns:repeat(2,1fr)}
.seat{width:100px;font-size:.75em}.card{width:26px;height:36px;font-size:12px}.card.big{width:34px;height:48px;font-size:16px}.table{aspect-ratio:4/3;border-width:6px}.seat .cards{height:40px}
.controls{gap:6px}.log{height:150px}
.body{font-size:1em;line-height:1.8}.toc ol{columns:1}.table.mini{max-height:260px}
}
</style>
</head>
<body>
<header>
<span class="logo">♠ 홀덤 30일</span>
<a class="tab" href="#home">대시보드</a><a class="tab" href="#course">30일 과정</a><a class="tab" href="#game">게임</a><a class="tab" href="#cards">암기카드</a><a class="tab" href="#terms">용어</a><a class="tab" href="#tools">도구</a><a class="tab" href="#links">자료</a>
<button class="theme" id="themeBtn" title="밝게/어둡게">◐</button>
</header>
<main id="view"></main>
<script src="poker.js"></script>
<script src="content.js"></script>
<script src="widgets.js"></script>
<script>
// ---------- 상태 ----------
const KEY = 'holdem30';
let S;
try { S = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { S = {}; }
S.done = S.done || {}; S.quiz = S.quiz || {}; S.cards = S.cards || {}; S.stats = S.stats || { hands: 0, won: 0, net: 0 };
if (S.hint === undefined) S.hint = true;
if (!S.speed) S.speed = 'slow';
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };
const $ = sel => document.querySelector(sel);
// 테마: 저장값 없으면 기기 설정을 따름. 버튼은 현재 보이는 것의 반대로 고정
const isDark = () => document.documentElement.dataset.theme === 'dark' || (!document.documentElement.dataset.theme && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
const applyTheme = () => { $('meta[name=theme-color]').setAttribute('content', isDark() ? '#000000' : '#ffffff'); };
$('#themeBtn').onclick = () => { S.theme = isDark() ? 'light' : 'dark'; document.documentElement.dataset.theme = S.theme; save(); applyTheme(); };
applyTheme();
const applyFont = () => { document.documentElement.style.fontSize = S.font ? S.font + 'px' : ''; };
applyFont();
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;');
// 텍스트 안의 A♠ 같은 카드 표기를 색칠. 본문 HTML에도 안전(태그 안에는 카드 표기가 없음)
const cc = html => html.replace(/([2-9TJQKA])([♠♥♦♣])/g, (m, r, s) => `<span class="cd s${'♠♥♦♣'.indexOf(s)}">${r}${s}</span>`)
  .replace(/<table>/g, '<div class="tw"><table>').replace(/<\/table>/g, '</table></div>'); // 표는 좁은 화면에서 가로 스크롤
const cardHtml = (c, big) => `<span class="card ${c.s === 1 || c.s === 2 ? 'r' : ''} ${big ? 'big' : ''}">${RANKS[c.r - 2]}<br>${SUITS[c.s]}</span>`;

// ---------- 라우팅 ----------
function route() {
  const h = location.hash.slice(1) || 'home';
  const [page, arg] = h.split('/');
  document.querySelectorAll('header a.tab').forEach(a => a.classList.toggle('on', a.getAttribute('href') === '#' + page || (page === 'day' && a.getAttribute('href') === '#course')));
  const v = $('#view');
  if (page === 'home') v.innerHTML = homeView();
  else if (page === 'course') v.innerHTML = courseView();
  else if (page === 'day') { v.innerHTML = dayView(+arg); mountDay(+arg); }
  else if (page === 'game') { v.innerHTML = gameView(); renderGame(); }
  else if (page === 'cards') { v.innerHTML = ''; mountCards(); }
  else if (page === 'tools') { v.innerHTML = toolsView(); mountTools(); }
  else if (page === 'terms') { v.innerHTML = termsView(); mountTerms(); }
  else if (page === 'links') v.innerHTML = linksView();
  else v.innerHTML = homeView();
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', route);

// ---------- 대시보드 ----------
function homeView() {
  const done = DAYS.filter(d => d.d <= 30 && S.done[d.d]).length;
  const next = DAYS.find(d => !S.done[d.d]) || DAYS[29];
  const qs = Object.values(S.quiz); const qavg = qs.length ? Math.round(qs.reduce((a, b) => a + b, 0) / qs.length) : null;
  const known = CARDS.filter(c => S.cards[c.tag + '|' + c.f]).length;
  const st = S.stats;
  return `
<h1>텍사스 홀덤 30일 과정</h1>
<p class="muted">하루 30분~1시간. 오늘 나오는 용어 훑기(5분) → 천천히 읽기(20~30분) → 퀴즈(10분) → 게임으로 연습(15분). 모르는 말이 나오면 "용어" 탭에서 검색하세요.</p>
<div class="panel"><div class="row" style="justify-content:space-between"><b>진도 ${done} / 30일</b><span class="muted">${Math.round(done / 30 * 100)}%</span></div>
<div class="bar"><i style="width:${done / 30 * 100}%"></i></div>
<p style="margin-top:12px"><a href="#day/${next.d}"><button class="gold">${S.done[next.d] ? '마지막 날 다시 보기' : '오늘 할 일'}: Day ${next.d} · ${esc(next.title)}</button></a></p></div>
<div class="row" style="align-items:stretch">
<div class="panel" style="flex:1;min-width:200px"><b>퀴즈</b><br><span class="muted small">푼 일차 ${qs.length} · 평균 ${qavg === null ? '-' : qavg + '%'}</span></div>
<div class="panel" style="flex:1;min-width:200px"><b>암기카드</b><br><span class="muted small">${known} / ${CARDS.length} 알아요</span> <a href="#cards" class="small">복습 →</a></div>
<div class="panel" style="flex:1;min-width:200px"><b>게임</b><br><span class="muted small">${st.hands}핸드 · 팟 획득 ${st.won}회 · 누적 ${st.net >= 0 ? '+' : ''}${st.net} 칩</span> <a href="#game" class="small">플레이 →</a></div>
</div>
<div class="panel"><b>이 과정의 구조</b>
<ul class="small">
<li><b>1주차</b> 규칙·족보·베팅·포지션·스타팅 핸드·오픈 차트. 목표: "80%는 폴드"가 몸에 배기.</li>
<li><b>2주차</b> 레이즈 대응·3벳·아웃츠·팟 오즈·임플라이드 오즈·사이즈. 목표: 숫자로 결정하기.</li>
<li><b>3주차</b> 플랍 텍스처·C-bet·밸류와 블러프·드로우·턴/리버·핸드 리딩. 목표: 이유 있는 베팅.</li>
<li><b>4주차</b> 플레이어 타입·멘탈·홈게임·토너먼트·푸시/폴드·ICM·GTO·에퀴티·온라인. 목표: 환경에 맞게 조정.</li></ul>
<p class="small muted">기준 환경: 6인 테이블(6-max), 노리밋, 100bb. 차트는 입문용으로 단순화했고, 정밀 차트는 자료 탭에 있습니다. 진도·퀴즈·카드 기록은 이 브라우저에만 저장됩니다.</p></div>`;
}

// ---------- 커리큘럼 ----------
function courseView() {
  let h = '<h1>30일 과정</h1>';
  WEEKS.forEach((w, wi) => {
    h += `<h2>${esc(w)}</h2><div class="days">` + DAYS.filter(d => d.w === wi + 1).map(d =>
      `<a class="daychip ${S.done[d.d] ? 'done' : ''}" href="#day/${d.d}"><b>Day ${d.d}</b>${esc(d.title)}<br><span class="muted">${esc(d.en)}</span></a>`).join('') + '</div>';
  });
  return h;
}
function dayView(n) {
  const d = DAYS.find(x => x.d === n); if (!d) return '<p>없는 일차입니다.</p>';
  const best = S.quiz[n];
  return `
<p class="small"><a href="#course">← 30일 과정</a> · ${esc(WEEKS[d.w - 1])}</p>
<h1>Day ${d.d}. ${esc(d.title)} <span class="muted" style="font-size:.6em;font-weight:400">${esc(d.en)}</span></h1>
<div class="panel"><b>오늘의 목표</b> ${esc(d.goal)}</div>
${d.terms ? `<details class="panel" open><summary>오늘 나오는 용어 ${d.terms.length}개 (먼저 한 번 훑어보세요)</summary><table class="terms">${d.terms.map(([t, m]) => `<tr><td>${cc(esc(t))}</td><td>${cc(esc(m))}</td></tr>`).join('')}</table></details>` : ''}
<details class="panel toc" open><summary>목차 <span class="muted small" style="font-weight:400">· 글자 크기 <button class="small" id="fMinus">가−</button> <button class="small" id="fPlus">가+</button></span></summary><ol id="toc"></ol></details>
<div class="panel body">${cc(d.body)}</div>
<div class="panel"><b>핵심 암기</b><ul>${d.memo.map(m => `<li>${cc(esc(m))}</li>`).join('')}</ul></div>
<div class="panel quiz"><b>퀴즈</b> <span class="muted small">(${d.quiz.length}문항${best !== undefined ? ' · 최고 ' + best + '%' : ''})</span><div id="quiz"></div><div id="quizResult"></div></div>
<div class="panel"><b>실습</b> ${cc(esc(d.task))} <a href="#game"><button class="small">게임 탭으로</button></a></div>
<div class="row" style="justify-content:space-between;margin:16px 0">
<span>${n > 1 ? `<a href="#day/${n - 1}"><button>← Day ${n - 1}</button></a>` : ''}</span>
<button id="doneBtn" class="${S.done[n] ? 'primary' : 'gold'}">${S.done[n] ? '✓ 완료함 (취소하려면 클릭)' : '오늘 완료 체크'}</button>
<span>${n < DAYS.length ? `<a href="#day/${n + 1}"><button>Day ${n + 1} →</button></a>` : ''}</span></div>`;
}

async function playHand() {

function collect() { G.players.forEach(p => { G.pot += p.bet; p.bet = 0; }); G.curBet = 0; G.minRaise = G.bb; G.raisers = 0; }
async function bettingRound(start) {

}
// 액션 적용. 풀 레이즈면 true (액션 재개방)
function apply(i, a) {

  if (toCall > 0) rec = eq >= need + 8 ? `<b>콜 가능</b> (이길 확률 ${eq}%가 필요한 ${need}%보다 높음)${eq > 70 ? '. 아주 강하니 레이즈도 생각해 보세요' : ''}` : eq >= need - 3 ? `<b>경계선</b> (이길 확률 ${eq}% ≈ 필요한 ${need}%). 맞췄을 때 더 받아낼 수 있는지(임플라이드 오즈), 내가 나중에 행동하는지로 결정` : `<b>폴드</b> 권장 (이길 확률 ${eq}%가 필요한 ${need}%보다 낮음)`;
  else rec = eq >= 65 ? `<b>밸류 벳</b>: 팟의 ½~⅔ (약 ${Math.round(potNow / 2)}~${Math.round(potNow * 2 / 3)}칩). 강하니 돈을 받아냅니다` : eq >= 45 ? '<b>체크</b> 또는 작은 벳 (중간 세기 카드는 팟을 크게 키우지 않습니다)' : '<b>체크</b> (약합니다. 상대가 1명이고 보드가 심심하고 내가 프리플랍에 올린 사람이면 작은 C벳(이어서 베팅)도 가능)';
  return `지금 내 카드: <b>${made}</b> · 상대 ${nOpp}명을 아무 카드나 들었다고 보면 이길 확률 약 <b>${eq}%</b>${toCall ? ` · ${toCall}을 콜하려면 이길 확률이 <b>${need}%</b>는 되어야 손해가 없음 (팟 오즈)` : ''}<br>추천: ${rec}<br><span class="muted small">이 확률은 상대 카드를 모른다고 가정한 어림값입니다. 상대가 세게 올렸다면 실제로는 더 낮습니다. "필요한 %" 계산법은 Day 11에서 배웁니다.</span>`;
}

route();
// 오프라인 캐시(PWA). https로 서비스될 때만 동작. 로컬 파일(file://)에서는 조용히 건너뜀
if (location.protocol.startsWith('http') && 'serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
